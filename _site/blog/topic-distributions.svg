<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Beta and theta distributions</title>
<desc id="desc">An illustrative topic assigns 50, 30 and 20 percent probability to three words. An illustrative document contains 70 and 30 percent of two topics.</desc>
<rect width="1000" height="550" fill="#f5f3ef"/>
<text x="55" y="65" font-family="Georgia,serif" font-size="33" fill="#24434a">Two distributions in topic modeling</text>
<rect x="50" y="98" width="435" height="380" rx="8" fill="#dfe8e7"/>
<rect x="515" y="98" width="435" height="380" rx="8" fill="#dfe8e7"/>
<g font-family="Georgia,serif" fill="#24434a">
<text x="78" y="150" font-size="29">β (beta): words in a topic</text>
<text x="543" y="150" font-size="29">θ (theta): topics in a document</text>
</g>
<g font-family="Arial,sans-serif" font-size="20" fill="#385e66">
<text x="78" y="190">Example: a “service” topic</text>
<text x="543" y="190">Example: one document</text>
<text x="78" y="246">staff</text><text x="78" y="318">help</text><text x="78" y="390">answer</text>
<text x="543" y="246">service</text><text x="543" y="318">access</text>
</g>
<g fill="#7c9fa4">
<rect x="175" y="219" width="210" height="31" rx="4"/><rect x="175" y="291" width="126" height="31" rx="4"/><rect x="175" y="363" width="84" height="31" rx="4"/>
<rect x="640" y="219" width="210" height="31" rx="4"/><rect x="640" y="291" width="90" height="31" rx="4"/>
</g>
<g font-family="Arial,sans-serif" font-size="20" fill="#24434a">
<text x="397" y="243">50%</text><text x="313" y="315">30%</text><text x="271" y="387">20%</text>
<text x="862" y="243">70%</text><text x="742" y="315">30%</text>
</g>
<text x="55" y="520" font-family="Arial,sans-serif" font-size="18" fill="#385e66">Simplified illustration; values are examples.</text>
</svg>