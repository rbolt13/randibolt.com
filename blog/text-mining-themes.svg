<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">From responses to topics</title>
<desc id="desc">Two example survey responses are associated with illustrative topics: access and service.</desc>
<rect width="1000" height="520" fill="#f5f3ef"/>
<text x="70" y="88" fill="#24434a" font-family="Georgia, serif" font-size="34">From responses to topics</text>
<text x="70" y="126" fill="#385e66" font-family="Arial, sans-serif" font-size="19">A simplified example</text>
<rect x="70" y="171" width="430" height="105" rx="8" fill="#dfe8e7"/>
<rect x="70" y="304" width="430" height="105" rx="8" fill="#dfe8e7"/>
<text x="96" y="217" fill="#283438" font-family="Georgia, serif" font-size="23">“The website was easy to use.”</text>
<text x="96" y="351" fill="#283438" font-family="Georgia, serif" font-size="23">“Staff answered my questions.”</text>
<path d="M510 224 H568 M510 357 H568" stroke="#7c9fa4" stroke-width="3"/>
<rect x="578" y="171" width="345" height="105" rx="8" fill="#c9d9d8"/>
