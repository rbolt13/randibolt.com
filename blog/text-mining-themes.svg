<text x="603" y="213" fill="#24434a" font-family="Georgia, serif" font-size="27">Access</text>
<text x="603" y="246" fill="#385e66" font-family="Arial, sans-serif" font-size="19">website · easy · use</text>
<text x="603" y="346" fill="#24434a" font-family="Georgia, serif" font-size="27">Service</text>
<text x="603" y="379" fill="#385e66" font-family="Arial, sans-serif" font-size="19">staff · answered · questions</text>
<text x="70" y="472" fill="#385e66" font-family="Arial, sans-serif" font-size="17">Illustrative examples, not results from an analysis.</text>
